name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer
          python -m pip install "cython<3.4" virtualenv

      - name: Prepare python-for-android
        run: |
          rm -rf "$GITHUB_WORKSPACE/python-for-android"

          git clone \
            --branch master \
            --depth 1 \
            https://github.com/kivy/python-for-android.git \
            "$GITHUB_WORKSPACE/python-for-android"

          cd "$GITHUB_WORKSPACE/python-for-android"

          echo "python-for-android commit:"
          git rev-parse HEAD

          echo "Patching p4a build.py..."

          python - <<'PY'
          from pathlib import Path

          p = Path("pythonforandroid/build.py")
          text = p.read_text()

          old = "shprint(host_python, '-m', 'venv', 'venv')"
          new = "shprint(host_python, '-m', 'venv', '--clear', 'venv')"

          if old not in text:
              raise SystemExit(
                  "ERROR: Expected venv line was not found in p4a build.py"
              )

          text = text.replace(old, new, 1)
          p.write_text(text)

          print("PATCH SUCCESSFUL")
          print("Changed:")
          print(old)
          print("To:")
          print(new)
          PY

          echo "Checking patch:"
          grep -n "venv.*--clear" pythonforandroid/build.py

      - name: Configure buildozer.spec
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          text = p.read_text()

          def replace_or_add(text, key, value):
              import re
              pattern = rf"(?m)^{re.escape(key)}\s*=.*$"
              if re.search(pattern, text):
                  return re.sub(pattern, f"{key} = {value}", text)
              return text + f"\n{key} = {value}\n"

          text = replace_or_add(
              text,
              "android.accept_sdk_license",
              "True"
          )

          text = replace_or_add(
              text,
              "p4a.source_dir",
              "%(source.dir)s/../python-for-android"
          )

          text = replace_or_add(
              text,
              "p4a.branch",
              "master"
          )

          p.write_text(text)
          PY

          echo "=============================="
          echo "FINAL BUILDOZER SPEC"
          echo "=============================="
          cat buildozer.spec

      - name: Verify files
        run: |
          echo "=============================="
          echo "PROJECT FILES"
          echo "=============================="

          ls -la

          echo "=============================="
          echo "MAIN.PY"
          echo "=============================="

          head -n 40 main.py

          echo "=============================="
          echo "P4A BUILD.PY PATCH"
          echo "=============================="

          grep -n "venv.*--clear" \
            python-for-android/pythonforandroid/build.py

      - name: Clean old Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build APK
        shell: bash
        run: |
          set +e

          buildozer -v android debug > build.log 2>&1

          STATUS=$?

          echo "$STATUS" > build_status.txt

          echo "======================================"
          echo "BUILD EXIT CODE: $STATUS"
          echo "======================================"

          exit 0

      - name: Show Build Error
        if: always()
        run: |
          echo "======================================"
          echo "LAST 250 LINES"
          echo "======================================"

          if [ -f build.log ]; then
            tail -n 250 build.log
          else
            echo "build.log not found"
          fi

          echo "======================================"
          echo "IMPORTANT ERRORS"
          echo "======================================"

          if [ -f build.log ]; then
            grep -iE \
              "error:|error |failed|exception|traceback|importerror|modulenotfounderror|BuildDependencyInstallError" \
              build.log | tail -n 100 || true
          fi

      - name: Show APK
        if: always()
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/dists/*/build/outputs/apk/*.apk
          if-no-files-found: warn

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Fail if build failed
        if: always()
        run: |
          STATUS=$(cat build_status.txt 2>/dev/null || echo 1)

          if [ "$STATUS" != "0" ]; then
            echo "Build failed with exit code $STATUS"
            exit "$STATUS"
          fi
