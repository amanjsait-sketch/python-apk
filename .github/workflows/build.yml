name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            buildozer \
            setuptools \
            virtualenv \
            "cython==0.29.34"

      - name: Configure Buildozer
        run: |
          echo "Checking buildozer.spec..."

          grep -q "^android.accept_sdk_license" buildozer.spec || \
            sed -i '/^orientation =/a android.accept_sdk_license = True' buildozer.spec

          grep -q "^p4a.branch" buildozer.spec || \
            sed -i '/^android.accept_sdk_license/a p4a.branch = master' buildozer.spec

          echo "--------------------------------------"
          cat buildozer.spec
          echo "--------------------------------------"

      - name: Set Android environment
        run: |
          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "ANDROIDSDK=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROIDSDK=$ANDROIDSDK"

          ls -la "$ANDROID_HOME"

          echo "Checking AIDL..."

          find "$ANDROID_HOME/build-tools" \
            -type f \
            -name aidl \
            -print

      - name: Check files
        run: |
          echo "=============================="
          echo "buildozer.spec"
          echo "=============================="
          cat buildozer.spec

          echo "=============================="
          echo "main.py"
          echo "=============================="
          head -n 30 main.py

      - name: Clean Buildozer cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Build APK
        shell: bash
        run: |
          set +e

          buildozer -v android debug > build.log 2>&1

          STATUS=$?

          echo "======================================"
          echo "BUILD EXIT CODE: $STATUS"
          echo "======================================"

          echo "$STATUS" > build_status.txt

          exit 0

      - name: Show Build Error
        if: always()
        run: |
          echo "======================================"
          echo "LAST 250 LINES"
          echo "======================================"

          if [ -f build.log ]; then
            tail -n 250 build.log
          else
            echo "build.log not found"
          fi

          echo "======================================"
          echo "IMPORTANT ERRORS"
          echo "======================================"

          if [ -f build.log ]; then
            grep -iE \
              "error:|error |failed|exception|traceback|importerror|modulenotfounderror|builddependencyinstallerror" \
              build.log | tail -n 100 || true
          fi

      - name: Show APK
        if: always()
        run: |
          echo "======================================"
          echo "APK FILES"
          echo "======================================"

          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/dists/*/build/outputs/apk/*.apk
          if-no-files-found: warn

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Fail if build failed
        if: always()
        run: |
          STATUS=$(cat build_status.txt 2>/dev/null || echo 1)

          if [ "$STATUS" != "0" ]; then
            echo "Build failed with exit code $STATUS"
            exit "$STATUS"
          fi
