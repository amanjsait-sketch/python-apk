name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

          python -m pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.34

      - name: Check files
        run: |
          echo "===== FILES ====="
          ls -la

          echo "===== BUILDOZER SPEC ====="
          cat buildozer.spec

          echo "===== MAIN.PY ====="
          test -f main.py
          echo "main.py OK"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          echo "===== STARTING BUILDOZER ====="

          timeout 45m buildozer -v android debug 2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo "===== BUILDOZER EXIT CODE: $STATUS ====="

          echo "===== LAST 200 LINES ====="
          tail -n 200 build.log

          exit $STATUS

      - name: Show APK
        if: always()
        run: |
          echo "===== BIN ====="

          if [ -d bin ]; then
            ls -lah bin
          else
            echo "No bin directory"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
