name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

          python -m pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.34

      - name: Check Buildozer
        run: |
          echo "===== BUILDOZER ====="
          which buildozer
          buildozer --version

          echo "===== PYTHON ====="
          python --version

          echo "===== FILES ====="
          ls -la

          echo "===== BUILDOZER SPEC ====="
          cat buildozer.spec

      - name: Build APK
        shell: bash
        run: |
          set +e

          echo "===== STARTING BUILDOZER ====="

          buildozer -v android debug > build.log 2>&1

          STATUS=$?

          echo "$STATUS" > build_status.txt

          echo "===== BUILDOZER FINISHED ====="
          echo "Exit code: $STATUS"

          exit 0

      - name: Show Build Log
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "        BUILDOZER ERROR LOG"
          echo "========================================"

          if [ -f build.log ]; then
            echo "Log size:"
            wc -c build.log

            echo ""
            echo "===== LAST 300 LINES ====="
            tail -n 300 build.log
          else
            echo "build.log was not created!"
          fi

          echo ""
          echo "========================================"
          echo "        BUILD STATUS"
          echo "========================================"

          if [ -f build_status.txt ]; then
            cat build_status.txt
          fi

      - name: Show APK
        if: always()
        run: |
          echo "===== APK FILES ====="

          if [ -d bin ]; then
            find bin -maxdepth 1 -type f -name "*.apk" -print
          else
            echo "No bin directory"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: |
            build.log
            build_status.txt
          if-no-files-found: warn

      - name: Finish Build
        if: always()
        shell: bash
        run: |
          if [ -f build_status.txt ]; then
            STATUS=$(cat build_status.txt)
            echo "Final Buildozer exit code: $STATUS"
            exit "$STATUS"
          else
            echo "Build status file not found"
            exit 1
          fi
