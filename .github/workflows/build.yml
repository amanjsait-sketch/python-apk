name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

          python -m pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.34

      - name: Check Buildozer
        run: |
          echo "===== BUILDOZER ====="
          which buildozer
          buildozer --version

          echo "===== PYTHON ====="
          python --version

          echo "===== FILES ====="
          ls -la

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          echo "===== STARTING APK BUILD ====="

          buildozer -v android debug 2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo "===== BUILDOZER EXIT CODE: $STATUS ====="

          echo "===== BIN DIRECTORY ====="

          if [ -d bin ]; then
            ls -lah bin
          else
            echo "bin directory was not created"
          fi

          exit $STATUS

      - name: Show APK
        if: always()
        run: |
          echo "===== APK FILES ====="

          if [ -d bin ]; then
            find bin -maxdepth 1 -type f -name "*.apk" -print
          else
            echo "No bin directory"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: warn
