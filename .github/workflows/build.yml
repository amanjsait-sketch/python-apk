name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext

          python -m pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.34

      - name: Check Buildozer
        run: |
          buildozer --version
          python --version
          java -version

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee build.log

      - name: Show Build Log
        if: always()
        run: |
          echo "========== LAST 200 LINES =========="
          if [ -f build.log ]; then
            tail -n 200 build.log
          else
            echo "build.log not found"
          fi

      - name: Show APK
        if: always()
        run: |
          echo "========== APK FILES =========="
          find . -type f -name "*.apk" -ls || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
