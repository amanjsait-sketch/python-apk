name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

          python -m pip install --upgrade pip

          pip install \
            buildozer \
            setuptools \
            "cython==0.29.34"

      - name: Check Buildozer
        run: |
          echo "===== PYTHON ====="
          python --version

          echo "===== BUILDOZER ====="
          buildozer --version

          echo "===== BUILDOZER PATH ====="
          which buildozer

          echo "===== PROJECT FILES ====="
          ls -la

          echo "===== BUILDOZER SPEC ====="
          cat buildozer.spec

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "        STARTING BUILDOZER BUILD"
          echo "========================================"

          echo "Automatically accepting Android SDK licenses..."

          yes | timeout 80m buildozer -v android debug 2>&1 | tee build.log

          STATUS=${PIPESTATUS[1]}

          echo "========================================"
          echo "       BUILDOZER EXIT CODE: $STATUS"
          echo "========================================"

          echo "===== LAST 200 LINES ====="
          tail -n 200 build.log

          exit $STATUS

      - name: Show APK
        if: always()
        run: |
          echo "========================================"
          echo "              APK FILES"
          echo "========================================"

          if [ -d bin ]; then
            ls -lah bin

            echo ""
            echo "APK files:"
            find bin -type f -name "*.apk" -print
          else
            echo "No bin directory found."
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: warn
