name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext \
            expect

          python -m pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.34

      - name: Check Buildozer
        run: |
          echo "===== BUILDOZER ====="
          which buildozer
          buildozer --version

          echo "===== PYTHON ====="
          python --version

          echo "===== JAVA ====="
          java -version

          echo "===== PROJECT FILES ====="
          ls -la

          echo "===== BUILDOZER SPEC ====="
          cat buildozer.spec

      - name: Build APK
        shell: bash
        run: |
          echo "===== STARTING BUILDOZER ====="

          set +e

          script -q -e -c "buildozer -v android debug" build.log

          STATUS=$?

          echo ""
          echo "===== BUILDOZER EXIT CODE ====="
          echo "$STATUS"

          exit 0

      - name: Show Build Log
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "          BUILDOZER LOG"
          echo "========================================"

          if [ -f build.log ]; then
            echo "Log file size:"
            wc -c build.log

            echo ""
            echo "===== LAST 300 LINES ====="
            tail -n 300 build.log

            echo ""
            echo "===== ERRORS ====="
            grep -iE "error|exception|failed|traceback" build.log | tail -n 100 || true
          else
            echo "build.log DOES NOT EXIST"
          fi

      - name: Show APK
        if: always()
        run: |
          echo "===== APK FILES ====="

          if [ -d bin ]; then
            find bin -maxdepth 1 -type f -name "*.apk" -print
          else
            echo "No bin directory"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: warn
