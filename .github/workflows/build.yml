name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            autopoint

          python -m pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.34

      - name: Check files
        run: |
          echo "===== FILES ====="
          ls -la
          echo "===== BUILDOZER SPEC ====="
          cat buildozer.spec

      - name: Build APK
        continue-on-error: true
        run: |
          buildozer -v android debug > build.log 2>&1
          echo $? > build_status.txt

      - name: Show Error
        if: always()
        run: |
          echo "===== BUILD STATUS ====="
          cat build_status.txt 2>/dev/null || true

          echo "===== LAST 200 LINES ====="
          tail -n 200 build.log 2>/dev/null || true

          echo "===== ERRORS ====="
          grep -iE "error:|error |failed|exception|undefined macro|command failed" build.log | tail -n 100 || true

          echo "===== APK ====="
          find . -type f -name "*.apk" -print || true

      - name: Write Summary
        if: always()
        run: |
          echo "# 🔧 Build APK Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Error messages" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error:|error |failed|exception|undefined macro|command failed" build.log | tail -n 100 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "## Last lines" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 build.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          echo "## APK files" >> "$GITHUB_STEP_SUMMARY"
          find . -type f -name "*.apk" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/dists/*/build/outputs/apk/*.apk
          if-no-files-found: ignore

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
