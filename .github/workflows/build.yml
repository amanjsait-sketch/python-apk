name: Check Buildozer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.34

      - name: Check Buildozer
        run: |
          echo "===== Python ====="
          python --version

          echo "===== Pip ====="
          pip --version

          echo "===== Buildozer location ====="
          which buildozer

          echo "===== Buildozer version ====="
          buildozer --version
