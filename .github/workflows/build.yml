name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            autopoint \
            gettext

          python -m pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.34

      - name: Check Buildozer
        run: |
          buildozer --version
          python --version
          java -version

      - name: Build APK
        shell: bash
        run: |
          set +e

          timeout 35m buildozer -v android debug 2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo "$STATUS" > build_status.txt

          echo "BUILD EXIT CODE: $STATUS"

          exit 0

      - name: Show Build Error
        if: always()
        run: |
          echo "========== LAST 200 LOG LINES =========="

          if [ -f build.log ]; then
            tail -n 200 build.log
          else
            echo "build.log not found"
          fi

          echo "========== ERROR LINES =========="

          if [ -f build.log ]; then
            grep -iE "error:|error |failed|exception|undefined macro" build.log | tail -n 100 || true
          fi

      - name: Show APK
        if: always()
        run: |
          echo "========== APK FILES =========="

          find . -type f -name "*.apk" -print 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: |
            bin/*.apk
            .buildozer/android/platform/build-*/dists/*/build/outputs/apk/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if build failed
        if: always()
        run: |
          STATUS=$(cat build_status.txt 2>/dev/null || echo 1)

          if [ "$STATUS" != "0" ]; then
            echo "Build failed with exit code $STATUS"
            exit "$STATUS"
          fi
